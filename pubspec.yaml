name: erp_mobile
description: AppPortal Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # HTTP
  dio: ^5.4.0
  # Realtime
  signalr_netcore: ^1.3.6
  # Local storage
  shared_preferences: ^2.3.0
  # State management
  provider: ^6.1.2
  # File picker
  file_picker: 10.3.10
  # Immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation cho freezed
  build_runner: ^2.4.9
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png

